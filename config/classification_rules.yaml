# LabBridge 数据分类分级规则文件
# 对应文档 02 第一节（数据分类）、文档 05 第二、五章（分级粒度与最小暴露面）
#
# 本文件是「人定规则、机器执行、人审例外」三层模型中的**规则层**。
# 外审时检查的就是这份文件：谁签署的、什么时候生效的、之后是否真的被执行。
# 使用 labbridge_auditlog.anchor_file() 可对本文件生成时间戳 + SHA-256 锚定。

meta:
  version: 1.0
  effective_from: 2026-10-22
  signed_by: 待签署
  review_cycle: 每季度 PDCA 复盘
  note: 分级规则由人定义，机器只负责执行；未覆盖的字段进例外层，不由机器拍板

# 字段 → 敏感等级。三值枚举：public / internal / sensitive（文档 02 第一节）
field_class:
  # 敏感：患者身份信息与原始单据
  patient_name: sensitive
  dob: sensitive
  address: sensitive
  phone: sensitive
  id_card: sensitive

  # 非敏感：脱敏后的结构化检验字段（文档 02：患者 ID、性别、项目、结果值、异常标志、仪器注释）
  patient_id: internal
  patient_pseudo_id: internal
  sex: internal
  specimen_id: internal
  test_item: internal
  test_name: internal          # 项目中文名（受控变更 2026-10-23：NHANES 回放新增，非身份字段）
  test_item_raw: internal
  result_value: internal
  result_value_raw: internal
  unit: internal
  ref_range: internal
  abnormal_flag: internal
  instrument_note: internal
  dept: internal
  region: internal
  data_source: internal

  # 公共：标准编号、公开协议字段
  protocol_version: public
  standard_ref: public

# 未列出的字段归入哪一类。
# 设为 unknown = 规则未覆盖 → 进例外队列由人裁定，机器不得自行决定其敏感性。
default_class: unknown

# 字段 → 掩码策略
mask_strategy:
  patient_name: mask
  dob: generalize_year
  address: generalize_region
  phone: mask_phone
  id_card: mask_idcard

# 脱敏后回扫正则（文档 02：脱敏正确率 100% → 命中即告警并阻断输出）
leak_patterns:
  - tag: id_card
    pattern: "\\d{17}[\\dXx]"
  - tag: phone
    pattern: "1[3-9]\\d{9}"
  - tag: landline
    pattern: "0\\d{2,3}-?\\d{7,8}"
  - tag: bank_card
    pattern: "\\d{16,19}"
